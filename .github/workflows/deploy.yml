name: CI/CD — Test → Build → Deploy

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy to staging"
        required: false
        default: "main"
      skip_tests:
        description: "Skip tests (emergency deploy only)"
        type: boolean
        required: false
        default: false

  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GCP_PROJECT_ID:         ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION:             asia-south1
  REGISTRY:               asia-south1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/rag-platform/rag-platform
  CHAINLIT_REGISTRY:      asia-south1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/rag-platform/rag-chainlit
  PROD_SERVICE:           rag-api-prod
  STAGING_SERVICE:        rag-api-staging
  CHAINLIT_PROD_SERVICE:  rag-ui-chainlit

jobs:
  # ── JOB 1 — TEST ────────────────────────────────────────────────────────────
  test:
    name: Test (Python 3.11)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_tests != 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create minimal test .env
        run: |
          cat > .env << 'EOF'
          SECRETS_BACKEND=local
          JWT_SECRET=ci-test-secret-not-used-in-production
          OPENAI_API_KEY=sk-test-placeholder
          DEFAULT_LLM_PROVIDER=openai
          DEFAULT_LLM_MODEL=gpt-4o-mini
          DEFAULT_EMBED_PROVIDER=openai
          DEFAULT_EMBED_MODEL=text-embedding-3-small
          CACHE_BACKEND=local
          STORAGE_BACKEND=local
          AUTH_BACKEND=local
          LOG_BACKEND=file
          LOG_LEVEL=WARNING
          CHROMA_PERSIST_DIR=chroma_db_test
          EOF

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short --timeout=60 \
            --ignore=tests/test_graph.py \
            --ignore=tests/test_igestion.py \
            --ignore=tests/test_pipeline.py \
            --ignore=tests/test_ingestion.py \
            --ignore=tests/test_step2.py \
            --ignore=tests/test_step3.py \
            -k "not test_mixed_session and not test_skips_already_set_env_vars"
        env:
          SECRETS_BACKEND: local

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: |
            .pytest_cache/
            test-results.xml
          retention-days: 7

  # ── JOB 2 — BUILD API IMAGE ─────────────────────────────────────────────────
  build:
    name: Build & Push API Image
    runs-on: ubuntu-latest
    needs: [test]
    if: |
      always() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account:            ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Compute image tag
        id: meta
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          BRANCH=$(echo "${{ github.ref_name }}" | sed 's|/|-|g')
          TAG="${BRANCH}-${SHA}"
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${TAG}"

      - name: Build API Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            --file Dockerfile.api \
            --tag "${{ env.REGISTRY }}:${{ steps.meta.outputs.image_tag }}" \
            --tag "${{ env.REGISTRY }}:latest" \
            --label "git.sha=${{ github.sha }}" \
            --label "built.by=github-actions" \
            --cache-from "${{ env.REGISTRY }}:latest" \
            .

      - name: Push API image
        run: |
          docker push "${{ env.REGISTRY }}:${{ steps.meta.outputs.image_tag }}"
          docker push "${{ env.REGISTRY }}:latest"

  # ── JOB 3 — BUILD CHAINLIT IMAGE ────────────────────────────────────────────
  build-chainlit:
    name: Build & Push Chainlit Image
    runs-on: ubuntu-latest
    needs: [test]
    if: |
      always() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account:            ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Compute image tag
        id: meta
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          BRANCH=$(echo "${{ github.ref_name }}" | sed 's|/|-|g')
          TAG="${BRANCH}-${SHA}"
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Chainlit image tag: ${TAG}"

      - name: Build Chainlit Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            --file Dockerfile.chainlit \
            --tag "${{ env.CHAINLIT_REGISTRY }}:${{ steps.meta.outputs.image_tag }}" \
            --tag "${{ env.CHAINLIT_REGISTRY }}:latest" \
            --label "git.sha=${{ github.sha }}" \
            --label "built.by=github-actions" \
            .

      - name: Push Chainlit image
        run: |
          docker push "${{ env.CHAINLIT_REGISTRY }}:${{ steps.meta.outputs.image_tag }}"
          docker push "${{ env.CHAINLIT_REGISTRY }}:latest"

  # ── JOB 4a — DEPLOY API TO STAGING ─────────────────────────────────────────
  deploy-staging:
    name: Deploy API → Staging
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'workflow_dispatch'
    environment: staging

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account:            ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run (staging)
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service:  ${{ env.STAGING_SERVICE }}
          region:   ${{ env.GCP_REGION }}
          image:    ${{ env.REGISTRY }}:${{ needs.build.outputs.image_tag }}
          env_vars: |
            SECRETS_BACKEND=gcp
            GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }}
            GCP_LOCATION=${{ env.GCP_REGION }}
            LOG_FORMAT=json
            LOG_BACKEND=cloud
            LOG_LEVEL=DEBUG
            ENVIRONMENT=staging
            AUTH_PROVIDER=firebase

      - name: Smoke test staging
        run: |
          URL=$(gcloud run services describe ${{ env.STAGING_SERVICE }} \
            --region=${{ env.GCP_REGION }} --format="value(status.url)")
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${URL}/health" || echo "000")
            [ "$STATUS" = "200" ] && echo "Health check passed ✓" && exit 0
            sleep 5
          done
          echo "Health check failed" && exit 1

  # ── JOB 4b — DEPLOY API TO PRODUCTION ───────────────────────────────────────
  deploy-production:
    name: Deploy API → Production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account:            ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run (production)
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service:  ${{ env.PROD_SERVICE }}
          region:   ${{ env.GCP_REGION }}
          image:    ${{ env.REGISTRY }}:${{ needs.build.outputs.image_tag }}
          env_vars: |
            SECRETS_BACKEND=gcp
            GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }}
            GCP_LOCATION=${{ env.GCP_REGION }}
            LOG_FORMAT=json
            LOG_BACKEND=cloud
            LOG_LEVEL=INFO
            ENVIRONMENT=production
            AUTH_PROVIDER=firebase

      - name: Smoke test production
        run: |
          URL=$(gcloud run services describe ${{ env.PROD_SERVICE }} \
            --region=${{ env.GCP_REGION }} --format="value(status.url)")
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${URL}/health" || echo "000")
            [ "$STATUS" = "200" ] && echo "Health check passed ✓" && exit 0
            sleep 5
          done
          echo "Health check failed" && exit 1

      - name: Summary
        run: |
          echo "### Production API deploy complete 🚀" >> $GITHUB_STEP_SUMMARY
          URL=$(gcloud run services describe ${{ env.PROD_SERVICE }} \
            --region=${{ env.GCP_REGION }} --format="value(status.url)")
          echo "| **URL** | ${URL} |" >> $GITHUB_STEP_SUMMARY

  # ── JOB 5 — DEPLOY CHAINLIT TO PRODUCTION ───────────────────────────────────
  deploy-chainlit:
    name: Deploy Chainlit → Production
    runs-on: ubuntu-latest
    needs: [build-chainlit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account:            ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Deploy Chainlit to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CHAINLIT_PROD_SERVICE }}
          region:  ${{ env.GCP_REGION }}
          image:   ${{ env.CHAINLIT_REGISTRY }}:${{ needs.build-chainlit.outputs.image_tag }}
          flags: --allow-unauthenticated --memory=1Gi --cpu=1 --timeout=300
          env_vars: |
            SECRETS_BACKEND=gcp
            GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }}
            GCP_LOCATION=${{ env.GCP_REGION }}
            RAG_API_URL=${{ vars.RAG_API_URL }}
            CHAINLIT_URL=${{ vars.CHAINLIT_URL }}
            LOG_LEVEL=INFO
            ENVIRONMENT=production
            CACHE_SIMILARITY_THRESHOLD=0.95
            CACHE_BACKEND=redis
          secrets: |
            CHAINLIT_AUTH_SECRET=chainlit-auth-secret:latest
            QDRANT_URL=rag-qdrant-url:latest
            REDIS_URL=rag-redis-url:latest
            AUDIT_DB_URL=rag-audit-db-url:latest
            OPENAI_API_KEY=rag-openai-api-key:latest
            QDRANT_API_KEY=rag-qdrant-api-key:latest
            INTERNAL_SERVICE_SECRET=rag-internal-service-secret:latest
            OAUTH_GOOGLE_CLIENT_ID=rag-oauth-google-client-id:latest
            OAUTH_GOOGLE_CLIENT_SECRET=rag-oauth-google-client-secret:latest

      - name: Smoke test Chainlit
        run: |
          URL=$(gcloud run services describe ${{ env.CHAINLIT_PROD_SERVICE }} \
            --region=${{ env.GCP_REGION }} --format="value(status.url)")
          echo "Chainlit URL: ${URL}"
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${URL}/healthz" || echo "000")
            echo "  Attempt ${i}: HTTP ${STATUS}"
            [ "$STATUS" = "200" ] && echo "Health check passed ✓" && exit 0
            sleep 10
          done
          echo "Chainlit still starting — check manually" && exit 0

      - name: Summary
        run: |
          echo "### Chainlit UI deployed 🚀" >> $GITHUB_STEP_SUMMARY
          URL=$(gcloud run services describe ${{ env.CHAINLIT_PROD_SERVICE }} \
            --region=${{ env.GCP_REGION }} --format="value(status.url)")
          echo "| **Chainlit URL** | ${URL} |" >> $GITHUB_STEP_SUMMARY